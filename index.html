<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Five People Make a Party</title>
<style>
  html, body { margin: 0; height: 100%; background: #2a2433; color: #f4eee6; font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px; box-sizing: border-box; }
  button { font: inherit; padding: 4px 10px; border-radius: 6px; border: 0; background: #f4eee6; color: #2a2433; }
  h1 { margin: 0; font-size: 20px; letter-spacing: 2px; text-align: center; }
  #clock { font-size: 22px; font-weight: bold; font-variant-numeric: tabular-nums; }
  #stage { flex: none; background: #1c1823; border-radius: 10px; touch-action: none; user-select: none; }
  #board { cursor: grab; }
  #restart, #undo { cursor: pointer; }
  #win { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: rgba(20,16,28,.85); text-align: center; padding: 16px; }
  #win.show { display: flex; }
  #win h2 { margin: 0; font-size: 30px; color: #ffd75e; }
  .block { transition: transform .18s ease-in, opacity .2s; }
  .block.held .tile { stroke: #fff; stroke-width: 6; }
</style>
</head>
<body>
<h1>FIVE PEOPLE MAKE A PARTY</h1>
<div id="clock"></div>
<svg id="stage">
  <g id="undo">
    <rect x="134" y="6" width="110" height="28" rx="14" fill="#3a3247"/>
    <text x="189" y="25" text-anchor="middle" font-size="15" fill="#f4eee6">↶ Undo</text>
  </g>
  <g id="restart">
    <rect x="256" y="6" width="110" height="28" rx="14" fill="#3a3247"/>
    <text x="311" y="25" text-anchor="middle" font-size="15" fill="#f4eee6">↻ Restart</text>
  </g>
  <g id="party" transform="translate(0,20)"></g>
  <svg id="board"></svg>
</svg>
<div id="win">
  <h2>FIVE PEOPLE MAKE A PARTY!</h2>
  <div id="winText"></div>
  <button id="again">Play again</button>
</div>

<script>
const S = 100, VARIANTS = 5;
// exactly 3 of each article: 45 pieces = 15 outfits = 5 trios, on a board with no spare cells
const COLS = 5, ROWS = 9;
const KINDS = ['hat', 'jacket', 'pants'];
const SVGNS = 'http://www.w3.org/2000/svg';

// ---------- art: every piece is drawn in a 100x100 box ----------
const ART = {
  hat: [
    `<rect x="30" y="18" width="40" height="46" fill="#2b2b3a"/>
     <rect x="30" y="52" width="40" height="9" fill="#d63a3a"/>
     <rect x="14" y="62" width="72" height="10" rx="5" fill="#2b2b3a"/>`,
    `<path d="M22,66 Q22,24 50,24 Q78,24 78,66 Z" fill="#1aa59a"/>
     <rect x="19" y="58" width="62" height="16" rx="7" fill="#0f7d74"/>
     <circle cx="50" cy="20" r="9" fill="#fff" stroke="#0f7d74" stroke-width="2"/>`,
    `<path d="M24,68 Q24,30 50,30 Q72,30 72,68 Z" fill="#f08a24"/>
     <rect x="24" y="62" width="70" height="9" rx="4.5" fill="#c96a10"/>
     <circle cx="49" cy="30" r="3" fill="#c96a10"/>`,
    `<ellipse cx="50" cy="65" rx="45" ry="8" fill="#d9b84a" stroke="#a8892a" stroke-width="1.5"/>
     <path d="M33,63 Q33,36 50,36 Q67,36 67,63 Z" fill="#d9b84a" stroke="#a8892a" stroke-width="1.5"/>
     <path d="M33,60 Q50,66 67,60 L67,52 Q50,58 33,52 Z" fill="#3a8fd6"/>`,
    `<path d="M50,8 L73,71 L27,71 Z" fill="#7a4fb5"/>
     <circle cx="50" cy="8" r="7" fill="#ffd75e"/>
     <circle cx="48" cy="34" r="3.5" fill="#ffd75e"/><circle cx="58" cy="52" r="3.5" fill="#ffd75e"/><circle cx="41" cy="58" r="3.5" fill="#ffd75e"/>`,
  ],
  jacket: [
    jacketBase('#2f3e6e') +
    `<path d="M41,20 L50,48 L59,20 Z" fill="#fff"/>
     <circle cx="50" cy="58" r="3" fill="#e0a100"/><circle cx="50" cy="70" r="3" fill="#e0a100"/>`,
    `<path d="M36,22 Q50,0 64,22 Z" fill="#8f2a20"/>` + jacketBase('#c0392b') +
    `<rect x="38" y="60" width="24" height="14" rx="4" fill="#8f2a20"/>
     <path d="M46,22 V38 M54,22 V38" stroke="#fff" stroke-width="2"/>`,
    jacketBase('#f1c40f') +
    `<rect x="29" y="32" width="42" height="6" fill="#222"/>
     <rect x="27" y="48" width="46" height="6" fill="#222"/>
     <rect x="26" y="64" width="48" height="6" fill="#222"/>`,
    `<path d="M33,20 L43,20 Q50,32 57,20 L67,20 Q64,40 74,48 L78,86 L22,86 L26,48 Q36,40 33,20 Z" fill="#2e8b57" stroke="rgba(0,0,0,.25)" stroke-width="1.5"/>
     <path d="M25,58 H75 M24,72 H76" stroke="#1f6440" stroke-width="2.5"/>
     <path d="M50,30 V86" stroke="#d8efe2" stroke-width="2.5"/>`,
    `<path d="M30,16 L8,64 L21,70 L36,42 Z M70,16 L92,64 L79,70 L64,42 Z" fill="#c8a165"/>
     <path d="M30,16 L70,16 L84,97 L16,97 Z" fill="#c8a165" stroke="rgba(0,0,0,.25)" stroke-width="1.5"/>
     <path d="M40,16 L50,36 L60,16 Z" fill="#8a6a3a"/>
     <rect x="23" y="54" width="54" height="7" fill="#6e5229"/><rect x="45" y="52" width="10" height="11" rx="2" fill="#e0c060"/>
     <path d="M50,61 V97" stroke="#8a6a3a" stroke-width="2"/>`,
  ],
  pants: [
    `<path d="M28,15 L72,15 L76,88 L56,88 L50,40 L44,88 L24,88 Z" fill="#3b6fb5"/>
     <rect x="28" y="15" width="44" height="7" fill="#2a5390"/>`,
    `<path d="M26,15 L74,15 L80,58 L55,58 L50,38 L45,58 L20,58 Z" fill="#3aa655"/>
     <rect x="26" y="15" width="48" height="7" fill="#2a7d3f"/>`,
    `<path d="M30,15 L70,15 L84,88 L58,88 L50,40 L42,88 L16,88 Z" fill="#d6459b"/>
     <rect x="30" y="15" width="40" height="7" fill="#a22f73"/>`,
    `<path d="M34,15 L66,15 L88,64 L12,64 Z" fill="#e67e22"/>
     <path d="M42,22 L32,64 M50,22 V64 M58,22 L68,64" stroke="#b85f12" stroke-width="2.5"/>
     <rect x="34" y="15" width="32" height="7" fill="#b85f12"/>`,
    `<path d="M30,15 L70,15 Q96,62 64,84 L54,84 L50,50 L46,84 L36,84 Q4,62 30,15 Z" fill="#8b1e3f"/>
     <rect x="35" y="82" width="12" height="7" rx="2" fill="#5e1229"/><rect x="53" y="82" width="12" height="7" rx="2" fill="#5e1229"/>
     <rect x="30" y="15" width="40" height="7" fill="#5e1229"/>`,
  ],
};
const TILE_FILL = { hat: '#fde9c9', jacket: '#d9e8fb', pants: '#dff3dc' };

function jacketBase(col) {
  return `<path d="M30,20 L10,66 L23,72 L36,44 Z M70,20 L90,66 L77,72 L64,44 Z" fill="${col}"/>
          <path d="M30,20 L70,20 L76,86 L24,86 Z" fill="${col}" stroke="rgba(0,0,0,.25)" stroke-width="1.5"/>`;
}

function personArt(h, j, p) {
  const skin = '#f2c9a0';
  return `
    <rect x="41" y="62" width="5.5" height="30" fill="${skin}"/><rect x="53.5" y="62" width="5.5" height="30" fill="${skin}"/>
    <ellipse cx="43" cy="93" rx="6" ry="3" fill="#333"/><ellipse cx="57" cy="93" rx="6" ry="3" fill="#333"/>
    <circle cx="36" cy="56.5" r="3.2" fill="${skin}"/><circle cx="64" cy="56.5" r="3.2" fill="${skin}"/>
    <g transform="translate(29,55) scale(.42)">${ART.pants[p]}</g>
    <path transform="translate(29,27) scale(.42)" d="M32,22 L13,65 L22,69 L37,44 Z M68,22 L87,65 L78,69 L63,44 Z" fill="${skin}"/>
    <g transform="translate(29,27) scale(.42)">${ART.jacket[j]}</g>
    <circle cx="50" cy="26" r="11" fill="${skin}"/>
    <circle cx="46" cy="26" r="1.3" fill="#333"/><circle cx="54" cy="26" r="1.3" fill="#333"/>
    <path d="M46,31 Q50,34 54,31" fill="none" stroke="#333" stroke-width="1.2" stroke-linecap="round"/>
    <g transform="translate(30,-9) scale(.4)">${ART.hat[h]}</g>`;
}

function blockMarkup(b) {
  if (b.kind === 'outfit') {
    return `<rect class="tile" x="5" y="5" width="90" height="90" rx="14" fill="#fffaf0" stroke="#e0a100" stroke-width="5"/>` +
           personArt(b.h, b.j, b.p);
  }
  return `<rect class="tile" x="4" y="4" width="92" height="92" rx="14" fill="${TILE_FILL[b.kind]}"/>` + ART[b.kind][b.v];
}

// ---------- state & layout ----------
const $ = id => document.getElementById(id);
const board = $('board'), stage = $('stage'), party = $('party');
const SEATS = 5, START_MINUTES = 18 * 60, PARTY_H = 160;
const W = COLS * S, H = ROWS * S;
let grid, seats, swipes, over, busy = false;
let undoState = null; // the position before the latest swipe; only one step is kept

stage.setAttribute('viewBox', `0 0 ${W} ${PARTY_H + H}`);
stage.style.aspectRatio = `${W} / ${PARTY_H + H}`;
stage.style.width = `min(100%, calc((100vh - 100px) * ${W / (PARTY_H + H)}))`;
for (const [k, v] of Object.entries({ viewBox: `0 0 ${W} ${H}`, y: PARTY_H, width: W, height: H }))
  board.setAttribute(k, v);

const rand = n => Math.floor(Math.random() * n);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const pad = n => String(n).padStart(2, '0');

// ---------- party table ----------
const chairX = i => W / 2 + (i - 2) * Math.min(120, (W - 80) / 4);
function drawParty() {
  let chairs = '', guests = '';
  for (let i = 0; i < SEATS; i++) {
    chairs += `<rect x="${chairX(i) - 32}" y="28" width="64" height="84" rx="10" fill="#7a4b2a"/>`;
    if (seats[i]) guests += `<g transform="translate(${chairX(i) - 55},2) scale(1.1)">${personArt(...seats[i])}</g>`;
  }
  const x0 = chairX(0) - 50, x1 = chairX(SEATS - 1) + 50;
  party.innerHTML = chairs + guests +
    `<rect x="${x0 + 26}" y="112" width="14" height="26" fill="#8a5a2c"/><rect x="${x1 - 40}" y="112" width="14" height="26" fill="#8a5a2c"/>
     <rect x="${x0}" y="98" width="${x1 - x0}" height="20" rx="8" fill="#c98d4f"/>`;
}
function clockText() {
  const m = START_MINUTES + swipes;
  return `${pad(Math.floor(m / 60) % 24)}:${pad(m % 60)}`;
}
function updateHud() {
  $('clock').textContent = clockText();
  $('undo').style.opacity = undoState ? 1 : 0.35;
  drawParty();
}

// ---------- board ----------
const place = (b, r, c) => { b.el.style.transform = `translate(${c * S}px, ${r * S}px)`; };

function makeBlock(data, r, c) {
  const el = document.createElementNS(SVGNS, 'g');
  el.setAttribute('class', 'block');
  el.innerHTML = blockMarkup(data);
  board.appendChild(el);
  const b = { ...data, el };
  place(b, r, c);
  return b;
}

// rebuild the board from rows of piece descriptions (null = empty cell)
function setGrid(cells) {
  board.innerHTML = '';
  grid = cells.map((row, r) => row.map((d, c) => d && makeBlock(d, r, c)));
}

function newGame() {
  seats = []; swipes = 0; over = false; undoState = null;
  $('win').classList.remove('show');
  updateHud();
  // redeal until the opening board has no ready-made outfit stack
  const stacked = d => d.some((p, i) => p.kind === 'pants' &&
    d[i - COLS]?.kind === 'jacket' && d[i - 2 * COLS]?.kind === 'hat');
  let deal;
  do {
    deal = KINDS.flatMap(kind => Array.from({ length: VARIANTS * 3 }, (_, i) => ({ kind, v: i % VARIANTS })));
    for (let i = deal.length - 1; i > 0; i--) {
      const k = rand(i + 1);
      [deal[i], deal[k]] = [deal[k], deal[i]];
    }
  } while (stacked(deal));
  setGrid(Array.from({ length: ROWS }, (_, r) => deal.slice(r * COLS, (r + 1) * COLS)));
}

// ---------- rules ----------
// the three cells starting at (r, c) and heading in direction (dr, dc)
const trio = (r, c, dr, dc) => [0, 1, 2].map(i => grid[r + i * dr]?.[c + i * dc]);
const outfitKey = b => b?.kind === 'outfit' ? `${b.h}-${b.j}-${b.p}` : null;

// hat over jacket over pants, top to bottom
function findMerges() {
  const out = [];
  for (let c = 0; c < COLS; c++)
    for (let r = 0; r + 2 < ROWS; r++) {
      const parts = trio(r, c, 1, 0);
      if (parts.every((b, i) => b?.kind === KINDS[i])) out.push({ r, c, parts });
    }
  return out;
}

// every outfit in a row or column run of three or more identical outfits
function findMatches() {
  const hit = new Set();
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      for (const [dr, dc] of [[0, 1], [1, 0]]) {
        const run = trio(r, c, dr, dc), key = outfitKey(run[0]);
        if (key && run.every(b => outfitKey(b) === key)) run.forEach(b => hit.add(b));
      }
  return hit;
}

async function applyGravity() {
  let moved = false;
  for (let c = 0; c < COLS; c++) {
    let write = ROWS - 1;
    for (let r = ROWS - 1; r >= 0; r--) {
      const b = grid[r][c];
      if (!b) continue;
      if (write !== r) {
        grid[r][c] = null;
        grid[write][c] = b;
        place(b, write, c);
        moved = true;
      }
      write--;
    }
  }
  if (moved) await sleep(220);
}

async function mergeOutfits() {
  const merges = findMerges();
  if (!merges.length) return false;
  for (const { r, c, parts: [hat, jacket] } of merges) {
    for (const b of [hat, jacket]) { place(b, r + 2, c); b.el.style.opacity = 0; }
    grid[r][c] = grid[r + 1][c] = null;
  }
  await sleep(200);
  for (const { r, c, parts } of merges) {
    for (const b of parts) b.el.remove();
    const [h, j, p] = parts.map(b => b.v);
    grid[r + 2][c] = makeBlock({ kind: 'outfit', h, j, p }, r + 2, c);
  }
  await sleep(120);
  return true;
}

async function seatGuests() {
  const matches = findMatches();
  if (!matches.size) return false;
  for (const b of matches) b.el.style.opacity = 0;
  await sleep(220);
  for (const b of matches) b.el.remove();
  grid = grid.map(row => row.map(b => matches.has(b) ? null : b));
  // one guest takes a seat per distinct outfit cleared
  const guests = new Map([...matches].map(b => [outfitKey(b), [b.h, b.j, b.p]]));
  seats.push(...[...guests.values()].slice(0, SEATS - seats.length));
  updateHud();
  return true;
}

async function resolve() {
  while (await mergeOutfits() || await seatGuests()) await applyGravity();
}

// a block may swap with any neighbour, or slide sideways into an empty cell; never up into the void
function canSwap(r1, r2, c2) {
  const target = grid[r2]?.[c2]; // undefined off the board, null when empty
  return target !== undefined && (target !== null || r1 === r2);
}

async function swap(r1, c1, r2, c2) {
  busy = true;
  undoState = {
    cells: grid.map(row => row.map(b => b && { kind: b.kind, v: b.v, h: b.h, j: b.j, p: b.p })),
    seats: [...seats],
    swipes,
  };
  swipes++;
  updateHud();
  const a = grid[r1][c1], b = grid[r2][c2];
  grid[r1][c1] = b; grid[r2][c2] = a;
  place(a, r2, c2);
  if (b) place(b, r1, c1);
  await sleep(190);
  await applyGravity();
  await resolve();
  busy = false;
  if (seats.length >= SEATS) {
    over = true;
    $('winText').textContent = `Everyone was seated by ${clockText()}.`;
    $('win').classList.add('show');
  }
}

function undo() {
  if (busy || over || !undoState) return;
  setGrid(undoState.cells);
  ({ seats, swipes } = undoState);
  undoState = null;
  updateHud();
}

// ---------- input: press a block, swipe towards a neighbour ----------
let drag = null;

function cellAt(e) {
  // map through the board's own coordinate system; its bounding rect only covers the
  // blocks still on it, so it shrinks as the board empties
  const m = board.getScreenCTM();
  const pt = new DOMPoint(e.clientX, e.clientY).matrixTransform(m.inverse());
  return { r: Math.floor(pt.y / S), c: Math.floor(pt.x / S), size: S * m.a };
}

function endDrag() {
  drag?.block.el.classList.remove('held');
  drag = null;
}

board.addEventListener('pointerdown', e => {
  if (busy || over) return;
  const { r, c, size } = cellAt(e), block = grid[r]?.[c];
  if (!block) return;
  drag = { r, c, x: e.clientX, y: e.clientY, size, block };
  block.el.classList.add('held');
  board.appendChild(block.el); // draw on top while swapping
  board.setPointerCapture(e.pointerId);
});

board.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < drag.size * 0.3) return;
  const { r, c } = drag;
  const horizontal = Math.abs(dx) > Math.abs(dy);
  const r2 = r + (horizontal ? 0 : Math.sign(dy)), c2 = c + (horizontal ? Math.sign(dx) : 0);
  endDrag();
  if (canSwap(r, r2, c2)) swap(r, c, r2, c2);
});

board.addEventListener('pointerup', endDrag);
board.addEventListener('pointercancel', endDrag);

$('restart').addEventListener('click', () => { if (!busy) newGame(); });
$('undo').addEventListener('click', undo);
$('again').addEventListener('click', newGame);

newGame();
</script>
</body>
</html>
