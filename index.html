<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Five People Make a Party</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<h1>5 People Make A Party</h1>
<div id="clock"></div>
<svg id="stage">
  <g id="undo">
    <title>Undo</title>
    <image href="graphics/controls/undo.svg" x="18" y="6" width="220" height="56"/>
  </g>
  <g id="restart">
    <title>Restart</title>
    <image href="graphics/controls/restart.svg" x="262" y="6" width="220" height="56"/>
  </g>
  <g id="party" transform="translate(0,44)"></g>
  <g id="board"></g>
</svg>
<div id="win">
  <h2>FIVE PEOPLE MAKE A PARTY!</h2>
  <div id="winText"></div>
  <button id="again">Play again</button>
</div>

<script src="game.js"></script>
</body>
</html>
